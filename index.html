<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon_alt.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cookadoo</title>
    <meta property="og:title" content="Cookadoo" />
    <meta property="og:description" content="A place to keep your recipes." />
    <meta property="og:image" content="https://cookadoo.app/banner.png" />
    <meta property="og:url" content="https://cookadoo.app" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://cookadoo.app/banner.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme")
          var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches
          if (dark) document.documentElement.classList.add("dark")
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
